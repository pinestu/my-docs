# 构建 VitePress 站点并部署到 GitHub Pages
name: Deploy VitePress site to Pages

on:
  # 在针对 main 分支的推送事件上运行
  push:
    branches: [main]

  # 允许从 Actions 标签页手动运行此工作流
  workflow_dispatch:

# 设置 GITHUB_TOKEN 的权限，允许部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 只允许一个并发部署，跳过正在进行和最新队列之间的运行
# 但是，不要取消正在进行的运行，因为我们希望允许这些生产部署完成
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 构建工作
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 如果启用 lastUpdated，则不需要
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm # 或 pnpm / yarn
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Install dependencies
        run: npm ci # 或 pnpm install / yarn install / bun install
      - name: Compute base path
        id: base
        run: |
          # CNAME 仍为占位符(未绑定自定义域名) → GitHub Pages 子路径 /my-docs/
          # CNAME 已替换为真实域名 → 根路径 / (无需修改任何代码)
          if [ -f docs/public/CNAME ] && ! grep -q "docs.example.com" docs/public/CNAME; then
            echo "base=/" >> "$GITHUB_OUTPUT"
          else
            echo "base=/my-docs/" >> "$GITHUB_OUTPUT"
          fi
      - name: Build with VitePress
        run: npm run docs:build
        env:
          VITEPRESS_BASE: ${{ steps.base.outputs.base }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  # 部署工作
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
